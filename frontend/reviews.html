<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizLink - Manual Reviews</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        biz: {
                            bg: '#0f1419', card: '#161b22', border: '#21262d', sidebar: '#0d1117',
                            primary: '#22c55e', primaryDark: '#16a34a', text: '#e6edf3', muted: '#8b949e'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #8b949e;
            border-left: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: #161b22;
            color: #e6edf3;
        }

        .nav-link.active {
            background-color: #161b22;
            color: #22c55e;
            border-left-color: #22c55e;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1419;
        }

        ::-webkit-scrollbar-thumb {
            background: #21262d;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-biz-bg text-biz-text font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-biz-sidebar border-r border-biz-border flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-biz-border">
            <span class="text-xl font-bold text-biz-primary">Biz<span class="text-white">Link</span></span>
        </div>
        <nav class="flex-1 py-4 overflow-y-auto"></nav>
        <div class="p-4 border-t border-biz-border bg-biz-sidebar">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-biz-primary flex items-center justify-center text-sm font-bold text-white"
                        id="user-avatar">U</div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-white" id="user-name">User</p>
                        <p class="text-xs text-biz-muted" id="user-role">Workspace</p>
                    </div>
                </div>
                <button onclick="BizLinkAuth.logout()" class="text-biz-muted hover:text-red-400 text-sm">Logout</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-biz-card border-b border-biz-border flex justify-between items-center px-6">
            <h2 class="text-lg font-semibold">Manual Review Queue</h2>
            <button onclick="loadReviews()"
                class="px-4 py-2 bg-biz-primary hover:bg-biz-primaryDark text-white rounded-lg text-sm font-medium transition">Refresh
                Queue</button>
        </header>

        <div class="flex-1 overflow-y-auto p-6">
            <div id="queue-container" class="grid grid-cols-1 gap-4">
                <div class="text-center py-12 text-biz-muted">Loading pending reviews...</div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!BizLinkAuth.checkAuth()) return;
            BizLinkNav.init();
            loadReviews();
        });

        async function loadReviews() {
            const container = document.getElementById('queue-container');
            container.innerHTML = '<div class="text-center py-12 text-biz-muted">Loading...</div>';
            try {
                const reviews = await BizLinkAPI.call('/manual-reviews?status=pending');
                container.innerHTML = '';
                if (!reviews || reviews.length === 0) {
                    container.innerHTML = '<div class="p-8 text-center text-biz-muted bg-biz-card rounded-lg border border-biz-border">No pending reviews. All caught up! 🎉</div>';
                    return;
                }
                reviews.forEach(review => {
                    container.innerHTML += `
                        <div class="bg-biz-card p-6 rounded-lg border border-biz-border shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2 py-1 rounded text-xs font-bold bg-yellow-900/30 text-yellow-400">${review.workflow_type?.toUpperCase() || 'ORDER'}</span>
                                    <span class="text-biz-muted text-sm">ID: #${review.id}</span>
                                </div>
                                <h3 class="text-lg font-medium text-white">Error at Step: <span class="text-biz-primary">${review.step_name || 'Unknown'}</span></h3>
                                <p class="text-biz-muted text-sm mt-1">${review.error_message || 'No error message'}</p>
                                <p class="text-biz-muted text-xs mt-2">Created: ${review.created_at ? new Date(review.created_at).toLocaleString() : 'Unknown'}</p>
                            </div>
                            <div class="flex gap-3 flex-shrink-0">
                                <button onclick="handleReview(${review.id}, 'reject')" class="px-4 py-2 rounded border border-red-500 text-red-400 hover:bg-red-500/20 transition text-sm">Reject</button>
                                <button onclick="handleReview(${review.id}, 'approve')" class="px-4 py-2 rounded bg-biz-primary text-white hover:bg-biz-primaryDark transition text-sm font-medium">Approve & Resume</button>
                            </div>
                        </div>`;
                });
            } catch (err) {
                console.error('Failed to load reviews:', err);
                container.innerHTML = `<div class="p-8 text-center text-yellow-400 bg-biz-card rounded-lg border border-biz-border">Using demo data (backend connection paused)<br><span class="text-biz-muted text-xs mt-2 block">Ensure backend is running on port 8000</span></div>`;
                setTimeout(() => {
                    container.innerHTML = `
                        <div class="p-8 text-center text-biz-muted bg-biz-card rounded-lg border border-biz-border mb-4">⚠️ Showing demo data - connect backend for real reviews</div>
                        <div class="bg-biz-card p-6 rounded-lg border border-biz-border shadow flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <span class="px-2 py-1 rounded text-xs font-bold bg-yellow-900/30 text-yellow-400">ORDER</span>
                                    <span class="text-biz-muted text-sm">ID: #demo-001</span>
                                </div>
                                <h3 class="text-lg font-medium text-white">Error at Step: <span class="text-biz-primary">payment_validation</span></h3>
                                <p class="text-biz-muted text-sm mt-1">Payment gateway timeout after 30s</p>
                                <p class="text-biz-muted text-xs mt-2">Created: ${new Date().toLocaleString()}</p>
                            </div>
                            <div class="flex gap-3 flex-shrink-0">
                                <button class="px-4 py-2 rounded border border-red-500 text-red-400 hover:bg-red-500/20 transition text-sm">Reject</button>
                                <button class="px-4 py-2 rounded bg-biz-primary text-white hover:bg-biz-primaryDark transition text-sm font-medium">Approve & Resume</button>
                            </div>
                        </div>`;
                }, 500);
            }
        }

        async function handleReview(id, action) {
            if (!confirm(`Are you sure you want to ${action} this workflow?`)) return;
            try {
                await BizLinkAPI.call(`/manual-reviews/${id}/${action}`, { method: 'POST' });
                loadReviews();
            } catch (err) {
                alert(`Action failed: ${err.message}\n\n(Demo mode - backend not connected)`);
            }
        }
    </script>
</body>

</html>
