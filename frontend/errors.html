<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizLink - Error Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        biz: {
                            bg: '#0f1419', card: '#161b22', border: '#21262d', sidebar: '#0d1117',
                            primary: '#22c55e', primaryDark: '#16a34a', text: '#e6edf3', muted: '#8b949e'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #8b949e;
            border-left: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background-color: #161b22;
            color: #e6edf3;
        }

        .nav-link.active {
            background-color: #161b22;
            color: #22c55e;
            border-left-color: #22c55e;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f1419;
        }

        ::-webkit-scrollbar-thumb {
            background: #21262d;
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-biz-bg text-biz-text font-sans flex h-screen overflow-hidden">
    <aside class="w-64 bg-biz-sidebar border-r border-biz-border flex flex-col flex-shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-biz-border">
            <span class="text-xl font-bold text-biz-primary">Biz<span class="text-white">Link</span></span>
        </div>
        <nav class="flex-1 py-4 overflow-y-auto"></nav>
        <div class="p-4 border-t border-biz-border bg-biz-sidebar">
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <div class="w-8 h-8 rounded-full bg-biz-primary flex items-center justify-center text-sm font-bold text-white"
                        id="user-avatar">U</div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-white" id="user-name">User</p>
                        <p class="text-xs text-biz-muted" id="user-role">Workspace</p>
                    </div>
                </div>
                <button onclick="BizLinkAuth.logout()" class="text-biz-muted hover:text-red-400 text-sm">Logout</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-biz-card border-b border-biz-border flex justify-between items-center px-6">
            <h2 class="text-lg font-semibold">Error Audit Logs</h2>
            <button onclick="loadLogs()"
                class="px-4 py-2 bg-biz-primary hover:bg-biz-primaryDark text-white rounded-lg text-sm font-medium transition">Refresh
                Logs</button>
        </header>

        <div class="flex-1 overflow-y-auto p-6">
            <div class="bg-biz-card rounded-xl border border-biz-border overflow-hidden">
                <table class="w-full text-left text-sm text-biz-muted">
                    <thead class="bg-biz-bg text-xs uppercase border-b border-biz-border">
                        <tr>
                            <th class="px-6 py-3">Time</th>
                            <th class="px-6 py-3">Workflow</th>
                            <th class="px-6 py-3">Error Type</th>
                            <th class="px-6 py-3">Message</th>
                            <th class="px-6 py-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="logs-list" class="divide-y divide-biz-border">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center">Loading logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (!BizLinkAuth.checkAuth()) return;
            BizLinkNav.init();
            loadLogs();
        });

        async function loadLogs() {
            const list = document.getElementById('logs-list');
            list.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-biz-muted">Loading...</td></tr>';
            try {
                const logs = await BizLinkAPI.call('/error-logs');
                list.innerHTML = '';
                if (!logs || logs.length === 0) {
                    list.innerHTML = '<tr><td colspan="5" class="px-6 py-4 text-center text-biz-muted bg-biz-card">No errors found. System is healthy! ✅</td></tr>';
                    return;
                }
                logs.forEach(log => {
                    const statusColor = log.resolved ? 'text-biz-primary bg-green-900/20' : 'text-red-400 bg-red-900/20';
                    const statusText = log.resolved ? 'Resolved' : 'Open';
                    list.innerHTML += `
                        <tr class="hover:bg-biz-bg transition-colors">
                            <td class="px-6 py-4 text-biz-muted text-xs">${log.timestamp ? new Date(log.timestamp).toLocaleString() : 'Unknown'}</td>
                            <td class="px-6 py-4 text-white font-medium">${log.workflow_type || 'Unknown'}</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 rounded bg-biz-border text-xs">${log.error_type || 'unknown'}</span></td>
                            <td class="px-6 py-4 max-w-xs truncate text-biz-muted">${log.error_message || 'No message'}</td>
                            <td class="px-6 py-4 font-bold ${statusColor} px-3 py-1 rounded-full text-xs inline-block">${statusText}</td>
                        </tr>`;
                });
            } catch (err) {
                console.error('Failed to load logs:', err);
                list.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-yellow-400 bg-biz-card">Using demo data (backend connection paused)<br><span class="text-biz-muted text-xs mt-1 block">Ensure backend is running on port 8000</span></td></tr>`;
                setTimeout(() => {
                    list.innerHTML = `
                        <tr class="bg-yellow-900/10"><td colspan="5" class="px-6 py-2 text-center text-yellow-400 text-xs">️ Showing demo data - connect backend for real logs</td></tr>
                        <tr class="hover:bg-biz-bg transition-colors">
                            <td class="px-6 py-4 text-biz-muted text-xs">${new Date().toLocaleString()}</td>
                            <td class="px-6 py-4 text-white font-medium">Order Automation</td>
                            <td class="px-6 py-4"><span class="px-2 py-1 rounded bg-biz-border text-xs">api_failure</span></td>
                            <td class="px-6 py-4 max-w-xs truncate text-biz-muted">WhatsApp API returned 429 rate limit</td>
                            <td class="px-6 py-4 font-bold text-red-400 bg-red-900/20 px-3 py-1 rounded-full text-xs inline-block">Open</td>
                        </tr>`;
                }, 500);
            }
        }
    </script>
</body>

</html>
